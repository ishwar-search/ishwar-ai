
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ishwar AI — Your AI Workspace</title>
  <meta name="description" content="Ishwar AI - Chat, Images, Videos, Files and Website Builder">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #f5f7ff;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 7%;
      border-bottom: 1px solid #252d43;
    }

    .logo { font-size: 24px; font-weight: 800; color: #8b9dff; }
    .tag { color: #a9b3c9; font-size: 13px; }

    main { max-width: 1050px; margin: auto; padding: 55px 20px; }
    .hero { text-align: center; margin-bottom: 40px; }

    .pill {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 25px;
      background: #1a2240;
      color: #b7c2ff;
      font-size: 13px;
    }

    h1 { font-size: clamp(35px, 7vw, 62px); margin: 22px 0 12px; }
    h1 span { color: #8b9dff; }
    .hero p { color: #aab4ca; line-height: 1.7; }

    .search {
      display: flex;
      gap: 10px;
      max-width: 680px;
      margin: 28px auto;
      background: #151c30;
      border: 1px solid #303b59;
      border-radius: 16px;
      padding: 10px;
    }

    .search input {
      flex: 1;
      min-width: 0;
      background: transparent;
      color: white;
      border: 0;
      outline: 0;
      padding: 12px;
      font-size: 16px;
    }

    button {
      background: #788bff;
      color: #0b1020;
      border: 0;
      border-radius: 11px;
      padding: 12px 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 25px;
    }

    .card {
      text-align: left;
      padding: 23px;
      border: 1px solid #29334c;
      border-radius: 18px;
      background: #12192b;
      color: white;
      min-height: 155px;
      transition: .2s;
    }

    .card:hover { border-color: #8798ff; transform: translateY(-3px); }
    .emoji { font-size: 29px; }
    .card h3 { margin: 15px 0 8px; }
    .card p { color: #aab4ca; line-height: 1.5; font-size: 14px; }

    #message {
      display: none;
      text-align: left;
      margin: 20px auto;
      padding: 18px;
      max-width: 680px;
      background: #151c30;
      border: 1px solid #303b59;
      border-radius: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #message.error { border-color: #a65b70; }
    #message strong { color: #aebaff; }
    .small-note { color: #aab4ca; font-size: 13px; }

    footer {
      text-align: center;
      padding: 25px;
      color: #8e99b3;
      border-top: 1px solid #252d43;
      font-size: 13px;
    }

    @media(max-width:650px) {
      header { padding: 16px; }
      main { padding: 42px 16px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .card { padding: 16px; }
      .search { gap: 4px; }
      .search button { padding: 10px 13px; }
    }

    @media(max-width:380px) {
      .grid { grid-template-columns: 1fr; }
      .tag { font-size: 11px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">✦ Ishwar AI</div>
    <div class="tag">Your AI Workspace</div>
  </header>

  <main>
    <section class="hero">
      <span class="pill">✦ Explore the power of AI</span>

      <h1>Imagine it.<br><span>Create it.</span></h1>

      <p>आपके विचारों से लेकर क्रिएशन तक — सब कुछ एक ही जगह।</p>

      <form class="search" id="askForm">
        <input
          id="question"
          type="text"
          placeholder="अपना सवाल यहाँ लिखें..."
          autocomplete="off"
          maxlength="4000"
          required
        >
        <button id="askButton" type="submit">पूछें ↗</button>
      </form>

      <p class="small-note">
        AI Chat अभी शुरुआती चरण में है। असली AI मॉडल अभी कनेक्ट नहीं है।
      </p>

      <div id="message" role="status" aria-live="polite"></div>
    </section>

    <h2>आप क्या करना चाहते हैं?</h2>

    <section class="grid">
      <button class="card" type="button" data-tool="chat">
        <div class="emoji">💬</div>
        <h3>AI Chat</h3>
        <p>सवाल भेजें और Chat API की जाँच करें।</p>
      </button>

      <button class="card" type="button" data-tool="image">
        <div class="emoji">🎨</div>
        <h3>AI Image</h3>
        <p>AI तस्वीर बनाने की सुविधा आगे जोड़ी जाएगी।</p>
      </button>

      <button class="card" type="button" data-tool="video">
        <div class="emoji">🎬</div>
        <h3>AI Video</h3>
        <p>वीडियो निर्माण के टूल्स के लिए जगह।</p>
      </button>

      <button class="card" type="button" data-tool="file">
        <div class="emoji">📁</div>
        <h3>File Tools</h3>
        <p>फाइलों के साथ काम करने के टूल्स।</p>
      </button>

      <button class="card" type="button" data-tool="website">
        <div class="emoji">🌐</div>
        <h3>Website Builder</h3>
        <p>अपनी वेबसाइट बनाने की शुरुआत करें।</p>
      </button>

      <button class="card" type="button" data-tool="plans">
        <div class="emoji">⭐</div>
        <h3>Plans & Pricing</h3>
        <p>मुफ़्त और भुगतान वाले प्लान की जानकारी।</p>
      </button>
    </section>
  </main>

  <footer>
    Ishwar AI · A project by Ishwar Ghanchi<br><br>
    © 2026 Ishwar AI
  </footer>

  <script>
    const form = document.getElementById("askForm");
    const input = document.getElementById("question");
    const button = document.getElementById("askButton");
    const messageBox = document.getElementById("message");

    function showMessage(text, isError = false) {
      messageBox.textContent = text;
      messageBox.classList.toggle("error", isError);
      messageBox.style.display = "block";
    }

    async function sendMessage(question) {
      button.disabled = true;
      button.textContent = "भेज रहे हैं...";
      showMessage("आपका संदेश Ishwar AI तक भेजा जा रहा है...");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message: question })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.reply || "संदेश भेजा नहीं जा सका।");
        }

        showMessage("Ishwar AI:\n" + data.reply);
      } catch (error) {
        showMessage(
          "कनेक्शन में समस्या आई। कुछ देर बाद फिर कोशिश करें।\n" +
          "विवरण: " + error.message,
          true
        );
      } finally {
        button.disabled = false;
        button.textContent = "पूछें ↗";
      }
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const question = input.value.trim();

      if (!question) {
        showMessage("भैया, पहले अपना सवाल लिखें।", true);
        return;
      }

      sendMessage(question);
    });

    document.querySelectorAll("[data-tool]").forEach(function(card) {
      card.addEventListener("click", function() {
        const tool = card.dataset.tool;

        if (tool === "chat") {
          input.focus();
          input.scrollIntoView({ behavior: "smooth", block: "center" });
          showMessage("अपना सवाल लिखकर “पूछें” दबाएँ।");
          return;
        }

        const names = {
          image: "AI Image",
          video: "AI Video",
          file: "File Tools",
          website: "Website Builder",
          plans: "Plans & Pricing"
        };

        showMessage(
          names[tool] +
          " का फीचर अभी तैयार नहीं है। इसे अगले चरण में जोड़ा जाएगा।"
        );
      });
    });
  </script>
</body>
</html>
